org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
# Keep the existing Kotlin Android plugin and legacy DSL during this integration;
# AGP 9 supports both compatibility opt-outs until the app migrates to built-in Kotlin.
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1
